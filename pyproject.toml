[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-websocket"
version = "0.1.0"
description = "LLM → TTS WebSocket demo for Engineered Arts take-home assignment."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Katrina Cheshire" }
]

# Runtime dependencies (what the app needs to run)
dependencies = [
  "fastapi>=0.121.3",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.4",
  "pydantic-settings>=2.12.0",
  "websockets>=15.0.1",
]

[project.optional-dependencies]
# Development tools – install with: pip install .[dev]
dev = [
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "black>=25.11.0",
  "isort>=7.0.0",
  "ruff>=0.14.6",
  "mypy>=1.19.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
default_section = "THIRDPARTY"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
  "tests",
]

[tool.uvicorn]
factory = false
reload = true
host = "127.0.0.1"
port = 8000
app = "app.websocket_server:app"
